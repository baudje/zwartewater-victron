[DEFAULT]

; dbus-serialbattery config for Zwartewater
; 2x EVE MB31 8-cell LFP with JK BMS
; Aligned with dbus-aggregate-batteries config.ini

; ----- Battery hardware -----
BATTERY_ADDRESSES = 0x01, 0x02
BMS_TYPE = Jkbms_pb

; ----- Current limits -----
; Per battery: 65A charge (130A total via aggregate — captures MPPT on top of a
; full 120A Quattro), 70A discharge (140A total). 65A = 0.21C on 314Ah cells.
MAX_BATTERY_CHARGE_CURRENT    = 65.0
MAX_BATTERY_DISCHARGE_CURRENT = 70.0

; ----- Cell voltage limits -----
; Aligned with aggregate driver settings
; Aggregate controls CVL via OWN_CHARGE_PARAMETERS — these are safety backstops
; Daily target 3.5625V/cell (CVL 28.5V). FALLBACK (2026-07-25) for the JK BMS
; SOC-100% latch: at the previous 3.55V/cell target, cells settled ~3.542V at
; tail current — ~3mV UNDER the JK SOC-100% Volt threshold (3.545V) — so the JK
; never latched 100% and its SoC drifted into the 80s while SmartShunt 277 read
; 100%. Packs are well balanced (1mV spread), so the fix is voltage, not balance.
; Raising the tail-held cell voltage to ~3.554V clears 3.545V and lets the JK
; latch every daily cycle. PREFERRED fix is instead lowering the JK app-side
; SOC-100% Volt to 3.535V (Cell OVPR below it); revert this to 3.550 once that's
; done. The 14-day SOC-reset cycle (3.60V/cell) resyncs JK+SmartShunt regardless.
MAX_CELL_VOLTAGE   = 3.5625
MIN_CELL_VOLTAGE   = 2.800
FLOAT_CELL_VOLTAGE = 3.375

; ----- Cell Voltage Current Management -----
; Taper charge current as cells approach the EVE hard limit (3.65V),
; not the daily charge target (3.55V). Full current allowed up to 3.55V
; so SoC reset completes quickly. Taper protects cells above that.
CVCM_ENABLE = True

CELL_VOLTAGES_WHILE_CHARGING      = 3.65, 3.60, 3.55, 3.30
MAX_CHARGE_CURRENT_CV_FRACTION    =    0, 0.2,  1,    1

CELL_VOLTAGES_WHILE_DISCHARGING   = 2.80, 2.90, 3.00, 3.10
MAX_DISCHARGE_CURRENT_CV_FRACTION =    0,  0.3,    1,    1

; ----- SoC reset (periodic balance cycle) -----
; On SoC-reset day, the driver OVERRIDES MAX_CELL_VOLTAGE upward to
; SOC_RESET_CELL_VOLTAGE — i.e. SOC_RESET is the balance-day target, not
; a hard ceiling above MAX. The driver requires SOC_RESET >= MAX (it
; auto-bumps and raises alarm #119 "settings invalid" otherwise).
;
; Normal day:  CVL = MAX_CELL_VOLTAGE × 8 = 28.40V (cells to 3.550V)
; Reset day:   CVL = SOC_RESET_CELL_VOLTAGE × 8 = 28.80V (cells to 3.600V)
;
; Hard cell ceilings come from JK Cell OVP (~3.575V, throttles current) and
; from the CVCM table above (current → 0 at 3.65V, the EVE absolute max).
;
; Cadence aligned with aggregate driver's BALANCING_REPETITION = 14.
SOC_RESET_CELL_VOLTAGE = 3.600
SOC_RESET_AFTER_DAYS = 14

; Hold absorption (28.4V CVL) for 30 min after tail current is reached.
; 5 min was too short for both packs' JK BMS to register a full-charge event
; and for SmartShunt LFP (277) charged-detection to sync — see 2026-04-21.
SWITCH_TO_FLOAT_WAIT_FOR_SEC = 1800

; Re-enter bulk/absorption when SoC dips below 95%. Default 80% is too low:
; the pack could sit at 80–95% indefinitely without ever re-entering bulk,
; so daily absorption to 3.55V/cell never happens between balance cycles.
SWITCH_TO_BULK_SOC_THRESHOLD = 95

; ----- Temperature-based derating -----
; EVE MB31 datasheet: 0.05P at 0°C, 0.12P at 5°C, 0.3P at 10°C, 0.5P at 15°C+
DCCM_T_ENABLE = True

TEMPERATURES_WHILE_CHARGING      =    0,    2,    5,   10,   15,   20,   35,   40,   55
MAX_CHARGE_CURRENT_T_FRACTION    = 0.00, 0.10, 0.20, 0.80, 1.00, 1.00, 1.00, 0.40, 0.00

TEMPERATURES_WHILE_DISCHARGING   =  -20,    0,    5,   10,   15,   45,   55
MAX_DISCHARGE_CURRENT_T_FRACTION = 0.00, 0.20, 0.30, 0.40, 1.00, 1.00, 0.00

; ----- UI -----
GUI_PARAMETERS_SHOW_ADDITIONAL_INFO = True
TELEMETRY = False
